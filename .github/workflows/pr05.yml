name: PR05 launch QoS bag

on:
  push:
  pull_request:

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w06-6eda53e1c566.tar.gz
  COURSE_KIT_SHA256: 6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-turtlesim \
            ros-jazzy-geometry-msgs \
            ros-jazzy-rosbag2 \
            ros-jazzy-rosbag2-storage-mcap \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ros \
            xvfb \
            python3-pytest \
            python3-flake8 \
            ros-jazzy-ament-flake8 \
            ros-jazzy-ament-pep257 \
            ros-jazzy-ament-copyright

      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select patrol course_bringup
          source install/setup.bash
          python3 -m pytest src/patrol/test
          xvfb-run -a python3 -m pytest src/course_bringup/test
          xvfb-run -a colcon test --packages-select patrol course_bringup --event-handlers console_direct+
          colcon test-result --verbose

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Check PR05 evidence
        shell: bash
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
