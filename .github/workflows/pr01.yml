name: PR01 evidence

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python3 -m json.tool report.json > /dev/null
          python3 -m json.tool evidence/pr01/environment.json > /dev/null

      - name: Evidence completeness
        run: python3 scripts/check_pr01.py
