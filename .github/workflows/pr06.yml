name: PR06 robot description

on:
  push:
  pull_request:

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w06-6eda53e1c566.tar.gz
  COURSE_KIT_SHA256: 6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-xacro \
            ros-jazzy-urdf \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-rviz2 \
            ros-jazzy-tf2-ros \
            ros-jazzy-tf2-tools \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-launch-testing-ros \
            ros-jazzy-ament-cmake-pytest \
            python3-pytest

      - name: Build and test course_description
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select course_description
          source install/setup.bash
          colcon test --packages-select course_description --event-handlers console_direct+
          colcon test-result --verbose

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Check PR06 evidence
        shell: bash
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR06 --submission .
